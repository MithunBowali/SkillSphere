<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - SkillSphere</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-gray-100 h-screen flex flex-col">

    <nav class="bg-white border-b p-4 flex justify-between items-center shrink-0">
        <div class="text-xl font-bold text-indigo-600 italic">SkillSphere Chat</div>
        <a href="index.html" class="text-sm font-semibold text-gray-500 hover:text-indigo-600">← Back to Profile</a>
    </nav>

    <div class="flex flex-1 overflow-hidden">
        
        <aside class="w-1/4 bg-white border-r hidden md:block overflow-y-auto">
            <div class="p-4 border-b">
                <input type="text" placeholder="Search chats..." class="w-full bg-gray-100 rounded-lg px-4 py-2 text-sm focus:outline-none border-none">
            </div>
            <div class="p-2 space-y-1">
                <div class="bg-indigo-50 p-3 rounded-xl flex items-center gap-3 cursor-pointer">
                    <img src="https://i.pravatar.cc/150?u=sarah" class="w-10 h-10 rounded-full">
                    <div class="overflow-hidden">
                        <p class="font-bold text-sm">Sarah Jenkins</p>
                        <p class="text-xs text-gray-500 truncate">I'm ready for the Python session!</p>
                    </div>
                </div>
                </div>
        </aside>

        <section class="flex-1 flex flex-col bg-white">
            <div class="p-4 border-b flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <img src="https://i.pravatar.cc/150?u=sarah" class="w-10 h-10 rounded-full">
                    <div>
                        <p class="font-bold text-sm">Sarah Jenkins</p>
                        <p class="text-[10px] text-green-500 font-bold uppercase tracking-wider">Teaching Python</p>
                    </div>
                </div>
                <button class="bg-indigo-600 text-white text-xs px-4 py-2 rounded-lg font-bold">Start Call</button>
            </div>

            <div class="flex-1 overflow-y-auto p-6 space-y-4 bg-gray-50">
                <div class="flex items-end gap-2 max-w-[80%]">
                    <div class="bg-white p-3 rounded-2xl rounded-bl-none shadow-sm text-sm text-gray-700">
                        Hey Ariful! Are we still meeting at 4 PM for the Python crash course?
                    </div>
                </div>
                <div class="flex items-end gap-2 max-w-[80%] ml-auto flex-row-reverse">
                    <div class="bg-indigo-600 p-3 rounded-2xl rounded-br-none shadow-sm text-sm text-white">
                        Yes, definitely! I've prepared some basic exercises for you.
                    </div>
                </div>
            </div>

            <div class="p-4 border-t flex items-center gap-3">
                <button class="text-gray-400 hover:text-indigo-600"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-width="2" stroke-linecap="round"/></svg></button>
                <input type="text" placeholder="Type your message..." class="flex-1 bg-gray-100 rounded-full px-5 py-2 text-sm focus:outline-none">
                <button class="bg-indigo-600 text-white p-2 rounded-full shadow-lg hover:bg-indigo-700 transition">
                    <svg class="w-5 h-5 transform rotate-90" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"/></svg>
                </button>
            </div>
        </section>
    </div>
<div class="lg:hidden fixed bottom-0 left-0 z-50 w-full h-16 bg-white border-t border-gray-200 shadow-2xl">
    <div class="grid h-full max-w-lg grid-cols-4 mx-auto font-medium">
        
        <a href="explore.html" class="inline-flex flex-col items-center justify-center px-5 hover:bg-gray-50 group">
            <svg class="w-6 h-6 mb-1 text-gray-500 group-hover:text-indigo-600 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span class="text-[10px] text-gray-500 group-hover:text-indigo-600 font-bold uppercase">Explore</span>
        </a>

        <a href="messages.html" class="inline-flex flex-col items-center justify-center px-5 hover:bg-gray-50 group">
            <div class="relative">
                <svg class="w-6 h-6 mb-1 text-gray-500 group-hover:text-indigo-600 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span class="absolute top-0 right-0 block h-2 w-2 rounded-full bg-red-500 ring-2 ring-white"></span>
            </div>
            <span class="text-[10px] text-gray-500 group-hover:text-indigo-600 font-bold uppercase">Chats</span>
        </a>

        <a href="#" class="inline-flex flex-col items-center justify-center px-5 hover:bg-gray-50 group">
            <svg class="w-6 h-6 mb-1 text-gray-500 group-hover:text-indigo-600 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span class="text-[10px] text-gray-500 group-hover:text-indigo-600 font-bold uppercase">Wallet</span>
        </a>

        <a href="index.html" class="inline-flex flex-col items-center justify-center px-5 hover:bg-gray-50 group">
            <img src="https://i.pravatar.cc/150?u=ariful" alt="Profile" class="w-6 h-6 rounded-full border border-gray-300 group-hover:border-indigo-600 transition">
            <span class="text-[10px] text-gray-500 group-hover:text-indigo-600 font-bold uppercase mt-1">Profile</span>
        </a>

    </div>
</div>
</body>
</html>
